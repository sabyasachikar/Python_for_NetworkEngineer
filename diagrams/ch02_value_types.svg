<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="470" fill="#ffffff"/>
  <text x="520" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1f3b57">The Four Everyday Value Types</text>
  <text x="520" y="64" text-anchor="middle" font-size="14" fill="#6b7280">Almost everything you store early on is one of these four</text>

  <!-- header row -->
  <rect x="60" y="90" width="200" height="40" fill="#1f3b57"/>
  <rect x="260" y="90" width="240" height="40" fill="#1f3b57"/>
  <rect x="500" y="90" width="230" height="40" fill="#1f3b57"/>
  <rect x="730" y="90" width="250" height="40" fill="#1f3b57"/>
  <text x="160" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Type</text>
  <text x="380" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">What it holds</text>
  <text x="615" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">How to spot it</text>
  <text x="855" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Network example</text>

  <!-- rows -->
  <g font-size="13.5" fill="#33475b">
    <!-- string -->
    <rect x="60" y="130" width="200" height="70" fill="#f7f9fc" stroke="#dde4ec"/>
    <rect x="260" y="130" width="240" height="70" fill="#ffffff" stroke="#dde4ec"/>
    <rect x="500" y="130" width="230" height="70" fill="#ffffff" stroke="#dde4ec"/>
    <rect x="730" y="130" width="250" height="70" fill="#ffffff" stroke="#dde4ec"/>
    <text x="76" y="170" font-size="14" font-weight="700" fill="#1f3b57">string (str)</text>
    <text x="276" y="170">text of any kind</text>
    <text x="516" y="170" font-family="DejaVu Sans Mono, monospace">wrapped in quotes</text>
    <text x="746" y="163" font-family="DejaVu Sans Mono, monospace" font-size="12.5">"GigabitEthernet0/1"</text>
    <text x="746" y="185" font-family="DejaVu Sans Mono, monospace" font-size="12.5">"10.0.0.1"</text>

    <!-- int -->
    <rect x="60" y="200" width="200" height="60" fill="#f7f9fc" stroke="#dde4ec"/>
    <rect x="260" y="200" width="240" height="60" fill="#ffffff" stroke="#dde4ec"/>
    <rect x="500" y="200" width="230" height="60" fill="#ffffff" stroke="#dde4ec"/>
    <rect x="730" y="200" width="250" height="60" fill="#ffffff" stroke="#dde4ec"/>
    <text x="76" y="235" font-size="14" font-weight="700" fill="#1f3b57">integer (int)</text>
    <text x="276" y="235">a whole number</text>
    <text x="516" y="235" font-family="DejaVu Sans Mono, monospace">no quotes, no dot</text>
    <text x="746" y="235" font-family="DejaVu Sans Mono, monospace" font-size="12.5">65001   (an ASN)</text>

    <!-- float -->
    <rect x="60" y="260" width="200" height="60" fill="#f7f9fc" stroke="#dde4ec"/>
    <rect x="260" y="260" width="240" height="60" fill="#ffffff" stroke="#dde4ec"/>
    <rect x="500" y="260" width="230" height="60" fill="#ffffff" stroke="#dde4ec"/>
    <rect x="730" y="260" width="250" height="60" fill="#ffffff" stroke="#dde4ec"/>
    <text x="76" y="295" font-size="14" font-weight="700" fill="#1f3b57">float</text>
    <text x="276" y="295">a decimal number</text>
    <text x="516" y="295" font-family="DejaVu Sans Mono, monospace">has a dot</text>
    <text x="746" y="295" font-family="DejaVu Sans Mono, monospace" font-size="12.5">10.0   (Gbps)</text>

    <!-- bool -->
    <rect x="60" y="320" width="200" height="60" fill="#eef7f4" stroke="#c7e2db"/>
    <rect x="260" y="320" width="240" height="60" fill="#ffffff" stroke="#dde4ec"/>
    <rect x="500" y="320" width="230" height="60" fill="#ffffff" stroke="#dde4ec"/>
    <rect x="730" y="320" width="250" height="60" fill="#ffffff" stroke="#dde4ec"/>
    <text x="76" y="355" font-size="14" font-weight="700" fill="#1f6b5f">boolean (bool)</text>
    <text x="276" y="355">a yes or no</text>
    <text x="516" y="355" font-family="DejaVu Sans Mono, monospace" fill="#1f6b5f">True or False</text>
    <text x="746" y="355" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#1f6b5f">True   (is it up?)</text>
  </g>

  <text x="520" y="420" text-anchor="middle" font-size="13" fill="#6b7280">The quotes are the key tell. "10" is text. 10 is a number you can do math with.</text>
</svg>
