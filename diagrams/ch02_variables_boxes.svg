<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="430" fill="#ffffff"/>
  <text x="520" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1f3b57">A Variable Is a Name That Points to a Value</text>
  <text x="520" y="64" text-anchor="middle" font-size="14" fill="#6b7280">You choose the name on the left. Python stores the value in the box on the right.</text>

  <!-- rows -->
  <g font-size="15">
    <!-- row 1 -->
    <text x="250" y="130" text-anchor="end" font-size="16" font-weight="600" fill="#1f3b57">hostname</text>
    <text x="270" y="130" font-size="18" fill="#8a94a3">=</text>
    <rect x="300" y="108" width="300" height="34" rx="5" fill="#eaf1f8" stroke="#b9d2ec"/>
    <text x="316" y="131" font-size="15" font-family="DejaVu Sans Mono, monospace" fill="#1f3b57">"core-sw-01"</text>
    <text x="620" y="130" font-size="13" fill="#7a8494">a piece of text (a string)</text>

    <!-- row 2 -->
    <text x="250" y="188" text-anchor="end" font-size="16" font-weight="600" fill="#1f3b57">vlan_id</text>
    <text x="270" y="188" font-size="18" fill="#8a94a3">=</text>
    <rect x="300" y="166" width="300" height="34" rx="5" fill="#eaf1f8" stroke="#b9d2ec"/>
    <text x="316" y="189" font-size="15" font-family="DejaVu Sans Mono, monospace" fill="#1f3b57">10</text>
    <text x="620" y="188" font-size="13" fill="#7a8494">a whole number (an integer)</text>

    <!-- row 3 -->
    <text x="250" y="246" text-anchor="end" font-size="16" font-weight="600" fill="#1f3b57">uplink_gbps</text>
    <text x="270" y="246" font-size="18" fill="#8a94a3">=</text>
    <rect x="300" y="224" width="300" height="34" rx="5" fill="#eaf1f8" stroke="#b9d2ec"/>
    <text x="316" y="247" font-size="15" font-family="DejaVu Sans Mono, monospace" fill="#1f3b57">10.0</text>
    <text x="620" y="246" font-size="13" fill="#7a8494">a decimal number (a float)</text>

    <!-- row 4 -->
    <text x="250" y="304" text-anchor="end" font-size="16" font-weight="600" fill="#1f3b57">is_reachable</text>
    <text x="270" y="304" font-size="18" fill="#8a94a3">=</text>
    <rect x="300" y="282" width="300" height="34" rx="5" fill="#e9f5f2" stroke="#a9d3ca"/>
    <text x="316" y="305" font-size="15" font-family="DejaVu Sans Mono, monospace" fill="#1f6b5f">True</text>
    <text x="620" y="304" font-size="13" fill="#7a8494">a yes or no value (a boolean)</text>
  </g>

  <rect x="140" y="345" width="760" height="60" rx="8" fill="#f4f7fb" stroke="#dbe3ee"/>
  <text x="160" y="371" font-size="13.5" fill="#42506a">After these four lines, writing hostname anywhere in your program is the same as writing "core-sw-01".</text>
  <text x="160" y="391" font-size="13.5" fill="#42506a">The name is a label you invent. The value is what Python keeps for you until you change it.</text>
</svg>
