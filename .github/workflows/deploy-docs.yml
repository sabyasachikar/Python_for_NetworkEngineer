name: Deploy docs

# Builds the MkDocs site and publishes it to GitHub Pages on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs tools
        run: pip install -r requirements-docs.txt
      - name: Build and publish
        run: mkdocs gh-deploy --force
